# Put inside an existing virtual host. Set config.php base_path to '/podsync'.
Alias /podsync /var/www/podsync/public
<Directory /var/www/podsync>
    Require all denied
</Directory>
<Directory /var/www/podsync/public>
    Options -Indexes -MultiViews
    AllowOverride All
    Require all granted
    CGIPassAuth On
</Directory>
