# Adapt the hostname, paths, port and existing PHP/TLS configuration to your server.
<VirtualHost *:80>
    ServerName podcasts.home.arpa
    DocumentRoot /var/www/podsync/public
    <Directory /var/www/podsync>
        Require all denied
    </Directory>
    <Directory /var/www/podsync/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
        CGIPassAuth On
    </Directory>
</VirtualHost>
